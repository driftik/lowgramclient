name: Build LowGram APK

on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OWPENGRAM_BUILD: "0" # Отключает проверку обновлений от OwpenGram

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ставим JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ставим Android SDK 36 и NDK 27.2
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Переименовываем в LowGram
        run: |
          # 1. Меняем applicationId, чтобы ставился отдельно от Telegram и OwpenGram
          sed -i 's/applicationId "[^"]*"/applicationId "com.lowgram.messenger"/g' TMessagesProj_AppStandalone/build.gradle
          
          # 2. Меняем отображаемое имя в ресурсах (английский, русский и остальные)
          find TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/OwpenGram/LowGram/g' {} +
          
          # 3. Меняем схему диплинков owpg:// на lowg://
          find TMessagesProj TMessagesProj_AppStandalone -name "AndroidManifest.xml" -exec sed -i 's/android:scheme="owpg"/android:scheme="lowg"/g' {} +

      - name: Генерируем ключ подписи (keystore)
        run: |
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias lowgram -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lowgram123 -keypass lowgram123 \
            -dname "CN=LowGram, OU=Dev, O=LowGram, L=City, S=State, C=US"

      - name: Собираем APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD=lowgram123 \
            -PRELEASE_KEY_ALIAS=lowgram \
            -PRELEASE_KEY_PASSWORD=lowgram123

      - name: Загружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: LowGram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          
